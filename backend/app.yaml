kind: wasmer.io/App.v0
name: marketscope-api
owner: norlandehubery
package: .
env:
  APP_NAME: MarketScope
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_LOCALE: fr
  APP_FALLBACK_LOCALE: fr
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  VIEW_COMPILED_PATH: /tmp
  SESSION_DRIVER: array
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  DB_CONNECTION: mysql
  SANCTUM_EXPIRATION: '43200'
  CORS_ALLOWED_ORIGINS: '*'
  ASSISTANT_PROVIDER: gemini
capabilities:
  database:
    engine: mysql
jobs:
- name: installer-production
  trigger: post-deployment
  action:
    fetch:
      path: /api/systeme/installer
      method: POST
      timeout: 120s
      expect:
        status_codes:
        - 200
- name: prix-obsoletes
  trigger: 0 3 * * *
  action:
    fetch:
      path: /api/systeme/prix-obsoletes
      method: POST
      timeout: 120s
app_id: da_RpXImtBUrVQg
